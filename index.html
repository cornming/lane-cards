<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三路卡陣</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: one-screen battle scene. Gilt status bar; a flagstone courtyard of three roads with hero
   medallions at each end (stacked enemy-top / you-bottom on phones); a teal-and-gold command bar below:
   battle log | deck pile + six card slots + end turn | card detail. */
:root{
  --bg:#170b09;          /* scorched maroon backdrop */
  --bg2:#2a1310;
  --teal:#12292b;        /* command-bar panel */
  --teal2:#0b1b1d;
  --teal3:#1b3a3c;
  --stone:#4a4553;       /* courtyard flagstone */
  --stone2:#3b3744;
  --mortar:#24212a;
  --fg:#efe6cf;
  --muted:#9fb3ad;
  --gold:#c9a043;
  --gold-hi:#f1d78c;
  --gold-lo:#7a5c1e;
  --ally:#3fa3ff;        /* blue ground ring */
  --foe:#ff4b3a;         /* red ground ring */
  --atk:#ffd54a;
  --hp:#ff6b5b;
  --heal:#7be08f;
  --q1:#4f8fd6; --q2:#a066e0; --q3:#e0b23e; --q4:#ef7a2e;
  --font-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --font-num:"Cinzel","Noto Serif TC",Georgia,serif;
  --font-body:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;
  background-image:radial-gradient(ellipse 70% 55% at 50% 35%, var(--bg2), transparent 75%),
    repeating-linear-gradient(115deg, rgba(255,90,40,.035) 0 1px, transparent 1px 60px),
    repeating-linear-gradient(35deg, rgba(255,90,40,.03) 0 1px, transparent 1px 90px);}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
#app{max-width:1220px;margin:0 auto;padding-inline:16px;padding-block:10px 24px;display:flex;flex-direction:column;gap:10px}

/* teal panel with a double gilt rule */
.frame{background:linear-gradient(180deg,var(--teal),var(--teal2));border:1px solid var(--gold-lo);border-radius:4px;
  box-shadow:inset 0 0 0 1px #050d0e, inset 0 0 0 2px rgba(201,160,67,.55), inset 0 0 22px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.6)}

/* status bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 14px}
.bar h1{font-family:var(--font-display);font-weight:900;font-size:24px;letter-spacing:.14em;margin:0;line-height:1.2;
  background:linear-gradient(180deg,#fff2c4,var(--gold) 60%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.ver{font-family:var(--font-num);font-size:11px;color:var(--muted);margin-left:-8px}
.turn{color:var(--muted)}
.turn b{font-family:var(--font-num);color:var(--gold-hi);font-size:18px;font-variant-numeric:tabular-nums}
.phase{padding:2px 12px;font-size:13px;border:1px solid var(--gold-lo);border-radius:3px;background:var(--teal2);letter-spacing:.06em}
.phase.p{color:#9fd0ff}
.phase.e{color:#ffaaa0}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{background:linear-gradient(180deg,var(--teal3),var(--teal2));border:1px solid var(--gold-lo);border-radius:3px;padding:5px 12px;font-size:13px;color:var(--fg)}
.btn:hover{border-color:var(--gold-hi)}

/* field */
#field{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px}
#field.v{flex-direction:column;gap:6px}
#heroP{order:-1}
#heroE{order:1}
#field.v #heroE{order:-1}
#field.v #heroP{order:1}
.hero{width:130px;flex:none;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
#field.v .hero{width:100%;max-width:540px;flex-direction:row;padding:6px 12px;gap:10px}
.face{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;line-height:1;
  background:radial-gradient(circle at 40% 35%, #3a5a5c, #0b1b1d);border:3px solid var(--gold);
  box-shadow:0 0 0 2px #050d0e, 0 0 14px 2px var(--c), 0 3px 8px rgba(0,0,0,.6)}
.hero.ally{--c:rgba(63,163,255,.55)}
.hero.foe{--c:rgba(255,75,58,.55)}
#field.v .face{width:42px;height:42px;font-size:21px;border-width:2px}
.hero .who{font-size:12px;color:var(--muted);text-align:center;line-height:1.3}
.hero .who b{display:block;color:var(--fg);font-family:var(--font-display);font-size:15px;letter-spacing:.06em}
#field.v .hero .who{text-align:left}
.hpwrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:3px}
#field.v .hpwrap{flex:1;flex-direction:row;align-items:center;gap:8px;min-width:0}
.hpbar{width:100%;height:9px;border-radius:2px;background:#050d0e;border:1px solid var(--gold-lo);overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(180deg,#ff7a66,#a11f12);transition:width .3s}
.hpnum{white-space:nowrap;font-family:var(--font-num);font-weight:700;font-size:24px;color:var(--hp);text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
#field.v .hpnum{font-size:19px}
.hpnum small{font-size:12px;color:var(--muted);font-weight:600;text-shadow:none}
.hero .sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.hero.hit{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* board: flagstone courtyard */
#boardWrap{flex:1;display:flex;justify-content:center;min-width:0;width:100%}
#board{flex:none;position:relative;border-radius:3px;touch-action:manipulation;background:var(--mortar);
  box-shadow:0 0 0 2px #050d0e, 0 0 0 4px var(--gold-lo), 0 8px 24px rgba(0,0,0,.7)}
#board::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 75% 85% at 50% 50%, transparent 55%, rgba(0,0,0,.45))}
#cells,#unitsLayer,#fxLayer{position:absolute;inset:0}
#unitsLayer,#fxLayer{pointer-events:none;z-index:2}
.cell{position:absolute;border:1.5px solid var(--mortar);border-radius:2px;
  background:linear-gradient(150deg,#58525f 0%,var(--stone) 35%,var(--stone2) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), inset 0 -2px 0 rgba(0,0,0,.2)}
.cell:nth-child(3n+1){background:linear-gradient(150deg,#524c59 0%,#46414f 40%,#38343f 100%)}
.cell.zP::before,.cell.zE::before{content:"";position:absolute;inset:0}
.cell.zP::before{background:rgba(63,163,255,.12)}
.cell.zE::before{background:rgba(255,75,58,.10)}
.cell.ok{outline:2px dashed var(--gold-hi);outline-offset:-5px;cursor:pointer;animation:pulse 1.2s infinite}
.cell.ok::after,.cell.tgt::after{content:"";position:absolute;inset:0;background:rgba(241,215,140,.22)}
.cell.tgt{cursor:pointer}
.cell.area::after{content:"";position:absolute;inset:0;background:rgba(239,122,46,.5)}
.cell.areaH::after{content:"";position:absolute;inset:0;background:rgba(123,224,143,.42)}
@keyframes pulse{50%{outline-color:rgba(241,215,140,.3)}}
.midline{position:absolute;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 12px);opacity:.5;z-index:1}

/* units: figures standing on glowing ground rings, attack | health below */
.unit{position:absolute;transition:left .22s ease,top .22s ease,opacity .3s;--t:48px}
.unit .base{position:absolute;left:8%;right:8%;bottom:16%;height:26%;border-radius:50%;
  border:2px solid var(--rc);box-shadow:0 0 10px var(--rc), inset 0 0 8px var(--rc);background:radial-gradient(ellipse, rgba(0,0,0,.35), transparent 70%)}
.unit.ally{--rc:var(--ally)}
.unit.foe{--rc:var(--foe)}
.unit.elite .base{border-color:var(--q4);box-shadow:0 0 14px var(--q4), inset 0 0 8px var(--q4)}
.unit.dead{opacity:0}
.unit.noanim{transition:none}
.unit .in{position:absolute;left:0;right:0;top:-6%;bottom:22%;display:flex;align-items:flex-end;justify-content:center}
.unit.lunge .in{animation:lunge .26s ease}
@keyframes lunge{45%{transform:translate(var(--lx),var(--ly)) scale(1.12)}}
.unit .ic{font-size:calc(var(--t)*.62);line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.7))}
.unit.foe .ic{transform:scaleX(-1)}
#field.v .unit .ic{transform:none}
.unit .nums{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);white-space:nowrap;
  font-family:var(--font-num);font-weight:700;font-size:calc(var(--t)*.27);line-height:1;font-variant-numeric:tabular-nums;
  text-shadow:0 0 2px #000,0 1px 2px #000,0 0 4px #000}
.unit .nums .a{color:var(--atk)}
.unit .nums i{color:rgba(255,255,255,.6);font-style:normal;margin:0 2px}
.unit .nums .h{color:#fff}
.unit .nums .h.low{color:var(--hp)}
.unit .st{position:absolute;top:-6px;right:0;font-size:calc(var(--t)*.24);line-height:1}
.unit .fly{position:absolute;top:-6px;left:0;font-size:calc(var(--t)*.24);line-height:1}

.float{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-num);font-weight:700;font-size:18px;white-space:nowrap;
  text-shadow:0 1px 2px #000,0 0 6px #000;animation:floatup .95s ease forwards;pointer-events:none;z-index:5}
.float.dmg{color:var(--hp)}
.float.heal{color:var(--heal)}
.float.tag{color:var(--gold-hi);font-family:var(--font-display);font-size:14px}
.float.ko{color:var(--fg);font-family:var(--font-display);font-size:14px}
.float.buff{color:#a8d8ff;font-family:var(--font-display);font-size:14px}
@keyframes floatup{0%{opacity:0;margin-top:6px}15%{opacity:1}100%{opacity:0;margin-top:-30px}}

/* command bar */
.hud{display:grid;grid-template-columns:230px minmax(0,1fr) 270px;gap:10px;padding:10px;align-items:stretch}
.log{list-style:none;margin:0;padding:8px 10px;font-size:12px;color:var(--muted);max-height:178px;overflow:auto;
  background:rgba(0,0,0,.35);border:1px solid #0a1718;border-radius:3px}
.log li{padding:1px 0}
.log li.P{color:#a9d4ff}
.log li.E{color:#ffb3aa}
.log li:first-child{color:var(--fg)}
.rack{min-width:0;display:flex;flex-direction:column;gap:8px}
.rackrow{display:flex;gap:10px;align-items:flex-start;min-width:0}
.pile{flex:none;width:78px;height:112px;border-radius:5px;position:relative;margin-top:10px;
  background:repeating-linear-gradient(45deg,#1d3d40 0 6px,#163133 6px 12px);border:2px solid var(--gold-lo);
  box-shadow:3px 3px 0 #0a1718, 5px 5px 0 #2a4b4e, 0 4px 8px rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.pile::before{content:"✦";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--gold-lo)}
.pile b{position:relative;margin-bottom:-12px;min-width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2b5a8c,#0f2440);
  border:2px solid var(--gold);font-family:var(--font-num);font-size:15px;display:flex;align-items:center;justify-content:center;color:#fff}
.hand{display:flex;gap:8px;overflow-x:auto;padding:10px 4px 8px;flex:1;min-width:0}
.rackfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rackfoot .deck{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.end{margin-left:auto;font-family:var(--font-display);font-weight:900;letter-spacing:.12em;color:#2a1c06;border:1px solid #5a410f;border-radius:3px;padding:8px 20px;
  background:linear-gradient(180deg,#fff0b8,var(--gold) 55%,var(--gold-lo));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 6px rgba(0,0,0,.6)}
.end:disabled{background:linear-gradient(180deg,var(--teal3),var(--teal2));color:var(--muted);border-color:var(--gold-lo);cursor:default}

/* cards: teal-framed portrait cards, wait top-left, attack bottom-left, health bottom-right */
.card{--q:var(--q1);flex:none;width:84px;height:118px;border-radius:5px;position:relative;padding:0;
  background:linear-gradient(180deg,#1d3a3d,#0d1f21);border:2px solid var(--q);
  box-shadow:inset 0 0 0 1px #050d0e, 0 3px 8px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:stretch;transition:transform .15s}
.card.q2{--q:var(--q2)}.card.q3{--q:var(--q3)}.card.q4{--q:var(--q4)}
.card .pt{margin:4px 4px 0;height:62px;border-radius:3px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%, var(--tc,#5a6a7a), #0d1f21 85%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
.card .ic{font-size:34px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.7))}
.card .nm{font-family:var(--font-display);font-size:12px;font-weight:900;line-height:1.2;text-align:center;margin-top:3px;color:var(--fg);padding:0 2px}
.card .ty{font-size:10px;color:var(--muted);text-align:center;line-height:1.3}
.card .a,.card .h{position:absolute;bottom:2px;font-family:var(--font-num);font-weight:700;font-size:16px;line-height:1;text-shadow:0 0 2px #000,0 1px 2px #000}
.card .a{left:5px;color:var(--atk)}
.card .h{right:5px;color:var(--hp)}
.card .k{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-family:var(--font-display);font-size:11px;color:var(--q2)}
.card .w{position:absolute;top:-9px;left:-9px;width:28px;height:28px;border-radius:50%;z-index:1;
  background:radial-gradient(circle at 40% 35%,#3b4a5a,#11181f);border:2px solid var(--gold-lo);color:#fff;
  font-family:var(--font-num);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 1px #000}
.card.wait .pt,.card.wait .nm{opacity:.45}
.card.ready{box-shadow:inset 0 0 0 1px #050d0e, 0 0 0 2px var(--gold-hi), 0 0 16px rgba(241,215,140,.5)}
.card.ready .w{background:radial-gradient(circle at 40% 35%,#fff0b8,#a87c22);border-color:#5a410f;color:#2a1c06;text-shadow:none}
.card.sel{transform:translateY(-8px)}
.card.lock{filter:saturate(.6) brightness(.8)}
.card.slot{border:2px dashed rgba(201,160,67,.3);background:repeating-linear-gradient(45deg,rgba(29,61,64,.35) 0 6px,rgba(22,49,51,.35) 6px 12px);box-shadow:none}
.empty{color:var(--muted);font-size:13px;padding:24px 4px}

.info{padding:10px 12px;min-height:120px;background:rgba(0,0,0,.35);border:1px solid #0a1718;border-radius:3px;min-width:0}
.info h3{margin:0 0 4px;font-family:var(--font-display);font-weight:900;font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--gold-hi)}
.chip{font-family:var(--font-body);font-size:11px;font-weight:600;padding:0 6px;border-radius:2px;border:1px solid rgba(239,230,207,.3);color:var(--fg)}
.chip.q1{border-color:var(--q1);color:#9cc6f2}.chip.q2{border-color:var(--q2);color:#d0aef5}.chip.q3{border-color:var(--q3);color:#f3d58a}.chip.q4{border-color:var(--q4);color:#f6b07a}
.chip.ally{border-color:var(--ally);color:#9fd0ff}.chip.foe{border-color:var(--foe);color:#ffaaa0}
.info .stats{font-family:var(--font-num);font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:2px 0 6px}
.info .stats b{color:var(--fg)}
.info ul{margin:0;padding-left:18px;font-size:13px}
.info .hint{font-size:13px;color:var(--gold-hi);margin-top:6px}
.info .cast{margin-top:8px;font-family:var(--font-display);font-weight:900;letter-spacing:.1em;color:#2a1c06;border:1px solid #5a410f;border-radius:3px;padding:6px 14px;
  background:linear-gradient(180deg,#fff0b8,var(--gold) 55%,var(--gold-lo))}

/* overlay */
#overlay{position:fixed;inset:0;background:rgba(12,5,4,.88);display:flex;align-items:flex-start;justify-content:center;overflow:auto;z-index:20;padding:24px 16px}
.panel{max-width:780px;width:100%;padding:24px;margin:auto}
.panel h2{font-family:var(--font-display);font-weight:900;font-size:clamp(30px,7vw,52px);letter-spacing:.16em;margin:0;text-wrap:balance;
  background:linear-gradient(180deg,#fff2c4,var(--gold) 60%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.panel .lead{color:var(--muted);margin:6px 0 18px;max-width:60ch}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.cls{text-align:left;color:var(--fg);background:linear-gradient(180deg,var(--teal3),var(--teal2));border:2px solid var(--gold-lo);border-radius:4px;padding:12px;
  display:flex;flex-direction:column;gap:4px;box-shadow:inset 0 0 0 1px #050d0e,0 3px 8px rgba(0,0,0,.5);transition:transform .15s}
.cls:hover{transform:translateY(-3px);border-color:var(--gold-hi)}
.cls .ic{font-size:30px}
.cls b{font-family:var(--font-display);font-weight:900;font-size:20px;letter-spacing:.1em;color:var(--gold-hi)}
.cls span{font-size:13px;color:var(--muted)}
.cls .sig{font-size:12px;color:var(--fg)}
.panel details summary{cursor:pointer;color:var(--gold-hi);font-family:var(--font-display)}
.rules{font-size:14px;padding-left:20px;margin:10px 0 0}
.rules li{margin:4px 0}
.result{font-size:16px;margin:8px 0 16px}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* ===== 主城與各功能畫面 ===== */
.btn.on{border-color:var(--gold-hi);color:var(--gold-hi)}
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:8px 14px;margin-bottom:10px}
.tbar .me{display:flex;align-items:center;gap:10px}
.face.sm{width:44px;height:44px;font-size:22px;border-width:2px;--c:rgba(63,163,255,.55)}
.tbar .me b{font-family:var(--font-display);font-size:15px;color:var(--fg)}
.tbar .lv{margin-left:8px;font-family:var(--font-num);color:var(--gold-hi)}
.xp{width:150px;height:7px;border-radius:2px;background:#050d0e;border:1px solid var(--gold-lo);overflow:hidden;margin-top:3px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#3fa3ff,#9fe0ff)}
.tbar .cur{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tbar .cur b{font-family:var(--font-num);color:var(--fg)}
.tbar .tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.townmap{padding:0;overflow:hidden}
.sky{padding:22px 20px 18px;background:linear-gradient(180deg,rgba(63,120,170,.35),transparent),
  radial-gradient(ellipse 60% 80% at 80% 0%, rgba(241,215,140,.18), transparent 70%);border-bottom:1px solid var(--gold-lo)}
.sky .title{font-family:var(--font-display);font-weight:900;font-size:clamp(30px,6vw,46px);letter-spacing:.16em;margin:0;
  background:linear-gradient(180deg,#fff2c4,var(--gold) 60%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.sky p{margin:4px 0 0;color:var(--muted)}
.blds{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:16px}
.bld{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:14px 10px;border-radius:4px;color:var(--fg);
  background:linear-gradient(180deg,var(--teal3),var(--teal2));border:1px solid var(--gold-lo);box-shadow:inset 0 0 0 1px #050d0e;transition:transform .15s}
.bld:hover:not(:disabled){transform:translateY(-3px);border-color:var(--gold-hi)}
.bld b{font-family:var(--font-display);font-size:17px;color:var(--gold-hi);letter-spacing:.08em}
.bld span:last-child{font-size:12px;color:var(--muted)}
.bld.soon{opacity:.55;cursor:default}
.medal{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;
  background:radial-gradient(circle at 40% 35%,#3a5a5c,#0b1b1d);border:3px solid var(--gold);box-shadow:0 0 0 2px #050d0e,0 3px 8px rgba(0,0,0,.6)}
.screen{padding:14px}
.sthead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sthead h2{margin:0;font-family:var(--font-display);font-weight:900;font-size:24px;letter-spacing:.12em;color:var(--gold-hi)}
.sthead .rate{margin-left:auto;color:var(--muted)}
.sthead .rate b{color:var(--gold-hi);font-family:var(--font-num)}
.muted{color:var(--muted);font-size:13px}
.regions{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.region{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 8px;border-radius:4px;color:var(--fg);
  background:linear-gradient(180deg,var(--tone),#101614);border:1px solid var(--gold-lo)}
.region .ic{font-size:28px}
.region b{font-family:var(--font-display);color:var(--gold-hi)}
.region em{font-style:normal;font-family:var(--font-num);font-size:12px;color:var(--muted)}
.region.on{border-color:var(--gold-hi);box-shadow:0 0 0 1px var(--gold-hi),0 0 14px rgba(241,215,140,.35)}
.region.lock{opacity:.45;cursor:default}
.chapter{border:1px solid var(--gold-lo);border-radius:4px;padding:12px;background:linear-gradient(180deg,color-mix(in srgb,var(--tone) 35%,transparent),rgba(0,0,0,.25))}
.chapter h3{margin:0 0 10px;font-family:var(--font-display);color:var(--gold-hi)}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.stage{background:rgba(0,0,0,.35);border:1px solid #0a1718;border-radius:3px;padding:10px;display:flex;flex-direction:column;gap:4px}
.stage .sn{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.stage .sn b{font-family:var(--font-display);font-size:16px}
.stage .sd{font-size:13px;color:var(--muted)}
.stage .end{margin:6px 0 0;align-self:flex-start}
.stage.lock{opacity:.55}
.stars{color:var(--atk);font-size:11px;letter-spacing:-1px}
.stars i{color:rgba(255,255,255,.18);font-style:normal}
.deckwrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:12px;align-items:start}
.decklist{background:rgba(0,0,0,.35);border:1px solid #0a1718;border-radius:3px;padding:10px;display:flex;flex-direction:column;gap:8px}
.decklist h3{margin:0;font-family:var(--font-display);color:var(--gold-hi);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dhead{display:flex;justify-content:space-between;align-items:center}
.dhead b{font-family:var(--font-display);color:var(--gold-hi)}
.dhead .bad{color:var(--hp)}
.dpow{color:var(--muted)}
.dpow b{font-family:var(--font-num);color:var(--gold-hi);font-size:18px}
.drows{display:flex;flex-direction:column;gap:3px;max-height:440px;overflow:auto;padding-right:4px}
.drow{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:2px;background:linear-gradient(90deg,var(--teal3),transparent);border:1px solid transparent;color:var(--fg);text-align:left}
.drow:hover{border-color:var(--hp)}
.dw{width:20px;height:20px;border-radius:50%;background:#11181f;border:1px solid var(--gold-lo);font-family:var(--font-num);font-size:12px;display:flex;align-items:center;justify-content:center}
.dn{flex:1}
.dk{font-family:var(--font-num);color:var(--gold-hi)}
.pool{min-width:0}
.tabs{margin-bottom:10px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px 10px;padding-top:8px}
.card.mini{width:auto;max-width:100px}
.card.mini .stars{position:absolute;top:2px;right:4px}
.card.mini .tag{position:absolute;left:50%;transform:translateX(-50%);bottom:-18px;font-size:11px;color:var(--muted);white-space:nowrap}
.cgrid .card.mini{margin-bottom:14px}
.card.mini.maxed{opacity:.5}
.card.mini.picked{box-shadow:inset 0 0 0 1px #050d0e,0 0 0 2px var(--gold-hi),0 0 14px rgba(241,215,140,.5)}
.card.mini:disabled{cursor:default}
.up{color:var(--heal)!important}
.codex{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px;align-items:start}
.ctabs{display:flex;flex-direction:column;gap:4px}
.ctab{display:flex;justify-content:space-between;padding:6px 10px;border-radius:3px;color:var(--fg);background:linear-gradient(180deg,var(--teal3),var(--teal2));border:1px solid #0a1718}
.ctab.on{border-color:var(--gold-hi);color:var(--gold-hi)}
.ctab em{font-style:normal;font-family:var(--font-num);color:var(--muted)}
.herohall .hstat{display:flex;gap:16px;align-items:center;margin-bottom:12px;--c:rgba(63,163,255,.55)}
.herohall ul{margin:0;padding-left:18px}
.herohall h3{font-family:var(--font-display);color:var(--gold-hi);margin:10px 0 4px}
.cls.on{border-color:var(--gold-hi);box-shadow:0 0 0 1px var(--gold-hi)}
.cls em{font-style:normal;font-size:12px;color:var(--heal)}
.rewards{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px}
.rewards span{padding:3px 10px;border:1px solid var(--gold-lo);border-radius:3px;background:var(--teal2);font-family:var(--font-num)}
.loot{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.loot .card.mini{width:92px}
@media (max-width:760px){
  .deckwrap,.codex{grid-template-columns:minmax(0,1fr)}
  .ctabs{flex-direction:row;flex-wrap:wrap}
  .drows{max-height:200px}
  .xp{width:110px}
}

@media (max-width:980px){
  .hud{grid-template-columns:minmax(0,1fr)}
  .hud .rack{order:-1}
  .log{max-height:110px}
}
@media (max-width:820px){ .bar h1{font-size:20px} }
@media (prefers-reduced-motion:reduce){
  .unit,.card,.hpbar i,.cls{transition:none}
  .cell.ok{animation:none}
  .unit.lunge .in,.hero.hit{animation:none}
}
</style>
</head>
<body>

<div id="app">
<div id="town" hidden></div>
<div id="battle">
  <header class="bar frame">
    <h1>三路卡陣</h1><span class="ver" id="ver"></span>
    <div class="turn">第 <b id="turnNo">1</b> 回合</div>
    <div id="phase" class="phase p">你的回合</div>
    <div class="tools">
      <button class="btn" id="autoBtn" type="button" aria-pressed="false">自動：關</button>
      <button class="btn" id="speedBtn" type="button">速度 1×</button>
      <button class="btn" id="rulesBtn" type="button">規則</button>
      <button class="btn" id="newBtn" type="button">撤退回城</button>
    </div>
  </header>

  <main id="field">
    <section class="hero foe frame" id="heroE"></section>
    <div id="boardWrap"><div id="board"><div id="cells"></div><div id="unitsLayer"></div><div id="fxLayer"></div></div></div>
    <section class="hero ally frame" id="heroP"></section>
  </main>

  <section class="hud frame">
    <ol class="log" id="log"></ol>
    <div class="rack">
      <div class="rackrow">
        <div class="pile" title="牌庫"><b id="pileN">0</b></div>
        <div class="hand" id="hand"></div>
      </div>
      <div class="rackfoot"><span class="deck" id="deckInfo"></span><button class="end" id="endBtn" type="button">結束回合</button></div>
    </div>
    <div class="info" id="info"></div>
  </section>
</div>
</div>
<div id="overlay"></div>

<script>
/* ================= 規則資料 ================= */
const VERSION='0.4.0';
const LANES=3, COLS=10, HERO_HP=40, HAND_MAX=6, START_HAND=3, SUDDEN=20;
const TYPES={
  melee:{n:'近戰',phys:1,fx:''},
  ranged:{n:'射擊',phys:1,fx:''},
  fire:{n:'火焰',fx:'命中附加燃燒：2 回合，每回合 2 傷害'},
  ice:{n:'冰結',fx:'命中附加緩速：下次移動力 -1'},
  thunder:{n:'雷擊',fx:'命中有 35% 機率暈眩一回合'},
  holy:{n:'神聖',fx:'無視護甲與魔抗'},
  dark:{n:'暗黑',fx:'命中附加中毒：3 回合，每回合 1 傷害'},
  wall:{n:'牆',phys:1,fx:'不會移動也不會攻擊'},
  magic:{n:'魔法',fx:''}
};
const CARDS={};
function U(id,name,icon,wait,atk,hp,move,range,type,ab={},ex={}){
  return {id,name,icon,kind:'unit',wait,atk,hp,move,range,type,ab,armor:ex.armor||0,ward:ex.ward||0,elite:!!ab.elite};
}
function K(id,cls,name,icon,wait,target,desc,ex={}){return {id,cls,name,icon,kind:'skill',wait,target,desc,...ex};}
[
  U('sword','見習劍士','⚔️',1,3,8,2,1,'melee'),
  U('shield','盾衛','🛡️',2,2,14,1,1,'melee',{counter:1},{armor:2}),
  U('archer','長弓手','🏹',2,3,6,1,3,'ranged'),
  U('wolf','狼騎兵','🐺',3,4,10,3,1,'melee',{charge:2}),
  U('pyro','火焰術士','🔥',3,3,7,1,3,'fire',{},{ward:1}),
  U('frost','冰晶法師','❄️',3,3,8,1,3,'ice',{},{ward:1}),
  U('storm','雷鳴巫','⚡',3,3,8,1,3,'thunder',{},{ward:1}),
  U('paladin','聖騎士','🌟',4,4,14,2,1,'holy',{first:1},{armor:1}),
  U('assassin','暗影刺客','🗡️',3,5,6,3,1,'dark',{first:1}),
  U('wall','石牆','🧱',1,0,16,0,0,'wall',{},{armor:1}),
  U('griffin','獅鷲騎士','🦅',4,4,10,3,1,'melee',{fly:1}),
  U('treant','樹人守衛','🌳',3,2,16,1,1,'melee',{counter:3,guard:1}),
  U('cannon','矮人砲手','💣',4,5,8,1,4,'ranged',{snipe:1}),
  U('medic','戰地醫者','🩹',2,1,8,1,2,'holy',{heal:2}),
  U('horn','號角兵','📯',2,2,7,2,1,'melee',{haste:1}),
  U('salamander','火蜥蜴','🦎',2,2,7,2,1,'fire',{strike:1}),
  U('dragon','龍騎將','🐉',6,6,22,2,2,'fire',{fly:1,elite:1},{armor:1,ward:1}),
  U('bishop','大主教','☀️',6,3,18,1,3,'holy',{heal:3,elite:1},{ward:2}),
  K('warcry','warrior','戰吼','📣',3,'none','我方場上所有單位攻擊 +2'),
  K('cleave','warrior','重斬','🪓',2,'enemy','對一個敵方單位造成 6 點物理傷害',{dmg:6,dtype:'melee'}),
  K('bulwark','warrior','鐵壁','🏰',2,'ally','一個我方單位護甲 +2、生命 +6'),
  K('heartshot','hunter','穿心箭','🎯',3,'none','直接對敵方英雄造成 6 點傷害'),
  K('trap','hunter','捕獸夾','🪤',2,'enemy','對一個敵方單位造成 3 點傷害並暈眩一回合',{dmg:3,dtype:'ranged'}),
  K('scout','hunter','偵查','🔭',1,'none','立刻抽 2 張牌'),
  K('fireball','mage','火球術','☄️',3,'area','2×2 範圍內的敵方單位受到 4 點火焰傷害並燃燒',{area:'sq2',dmg:4,dtype:'fire'}),
  K('nova','mage','冰霜新星','🧊',3,'area','三條路同一格位的敵方單位受到 3 點冰結傷害並緩速',{area:'rank',dmg:3,dtype:'ice'}),
  K('missile','mage','奧術飛彈','✨',1,'enemy','對一個敵方單位造成 3 點魔法傷害',{dmg:3,dtype:'magic'}),
  K('mend','priest','治癒之光','💚',2,'area','3×3 範圍內的我方單位回復 6 生命',{area:'sq3',heal:6}),
  K('judgement','priest','聖光審判','🔆',2,'enemy','對一個敵方單位造成 5 點神聖傷害，無視防禦',{dmg:5,dtype:'holy'}),
  K('sanctuary','priest','庇護','🕊️',3,'none','我方英雄回復 8 生命，場上我方單位各回復 3 生命'),
].forEach(c=>CARDS[c.id]=c);
const RACE={sword:'人類',shield:'人類',archer:'精靈',wolf:'獸人',pyro:'人類',frost:'精靈',storm:'地精',paladin:'人類',assassin:'亡靈',wall:'地精',
  griffin:'野獸',treant:'精靈',cannon:'地精',medic:'人類',horn:'獸人',salamander:'野獸',dragon:'巨魔',bishop:'人類'};
const QNAME=['','藍','紫','金','橙'];
const TCOLOR={melee:'#6b6f80',ranged:'#4f7a46',fire:'#a4482a',ice:'#3f7fa6',thunder:'#8a8a2a',holy:'#a08f4a',dark:'#5d3f80',wall:'#6a6258'};
function quality(def){ if(def.elite) return 4; if(def.wait>=4) return 3; if(def.wait>=3) return 2; return 1; }
const MASTERY=0.25;

const CLASSES={
  warrior:{name:'戰士',icon:'🛡️',desc:'強化部隊攻擊，正面推進。',sig:'戰吼・重斬・鐵壁',
    deck:{sword:3,shield:2,wolf:2,archer:2,horn:2,paladin:1,griffin:1,wall:1,dragon:1,warcry:1,cleave:2,bulwark:2}},
  hunter:{name:'遊俠',icon:'🏹',desc:'遠程壓制，直接射擊敵方英雄。',sig:'穿心箭・捕獸夾・偵查',
    deck:{sword:2,archer:3,cannon:2,wolf:2,assassin:2,wall:2,horn:1,griffin:1,heartshot:2,trap:2,scout:1}},
  mage:{name:'法師',icon:'🔮',desc:'範圍法術與控制敵軍。',sig:'火球術・冰霜新星・奧術飛彈',
    deck:{sword:2,pyro:2,frost:2,storm:2,salamander:2,wall:2,treant:1,shield:1,dragon:1,fireball:2,nova:1,missile:2}},
  priest:{name:'牧師',icon:'📿',desc:'治療與防禦，聖光傷害。',sig:'治癒之光・聖光審判・庇護',
    deck:{sword:2,shield:2,medic:2,paladin:2,treant:2,archer:2,horn:1,wall:1,bishop:1,mend:2,judgement:2,sanctuary:1}},
};

function abilityLines(def){
  const a=def.ab||{}, out=[];
  if(a.elite) out.push('精銳：我方場上同時只能有一隻精銳');
  if(a.first) out.push('先制：被射程內的敵人攻擊時先出手，擊殺就取消對方攻擊');
  if(a.counter) out.push(`反擊 ${a.counter}：被攻擊後對攻擊者造成 ${a.counter} 點傷害`);
  if(a.fly) out.push('飛行：越過地面單位前進，只攻擊飛行單位與英雄；地面近戰打不到它');
  if(a.guard) out.push('警戒：也能攻擊四周相鄰的敵人（後方、鄰路）');
  if(a.charge) out.push(`衝鋒 ${a.charge}：同回合移動 2 格以上後攻擊 +${a.charge}`);
  if(a.snipe) out.push('狙擊：優先攻擊射程內生命最低的敵人');
  if(a.heal) out.push(`治療 ${a.heal}：每回合回復相鄰友軍 ${a.heal} 生命`);
  if(a.haste) out.push(`加速 ${a.haste}：每回合開始，待機最久的手牌再減 ${a.haste}`);
  if(a.strike) out.push(`直擊 ${a.strike}：每回合直接對敵方英雄造成 ${a.strike} 點傷害`);
  const fx=TYPES[def.type]?.fx; if(fx && def.type!=='melee' && def.type!=='ranged') out.push(`${TYPES[def.type].n}：${fx}`);
  return out;
}

/* ================= 狀態與引擎 ================= */
let S=null, busy=false, speed=1;
const ui={render(){},float(){},lunge(){},heroHit(){},log(){},over(){},sleep:ms=>Promise.resolve()};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const dir=s=>s==='P'?1:-1;
const foeOf=s=>s==='P'?'E':'P';
const heroColFor=s=>s==='P'?COLS:-1;
const who=s=>s==='P'?'你':'對手';
const unitAt=(l,c)=>S.units.find(u=>u.lane===l&&u.col===c);
const dist=(a,b)=>Math.abs(a.lane-b.lane)+Math.abs(a.col-b.col);
const isFly=u=>!!CARDS[u.id].ab.fly;

function starterDeck(cls){const deck=[]; for(const [id,n] of Object.entries(CLASSES[cls].deck)) for(let i=0;i<n;i++) deck.push(id); return deck;}
function newSide(cls,o={}){
  const hp=o.hp||HERO_HP;
  return {cls,hp,maxHp:hp,deck:shuffle((o.deck||starterDeck(cls)).slice()),hand:[],discard:[],stars:o.stars||{},starAll:o.starAll||1};
}
// opts.P / opts.E：{deck:[卡牌 id], stars:{id:星級}, starAll:預設星級, hp:英雄生命}
function newGame(pcls,ecls,opts={}){
  S={phase:'play',turn:1,active:'P',winner:null,auto:false,ctx:opts.ctx||null,
     sides:{P:newSide(pcls,opts.P),E:newSide(ecls,opts.E)},units:[],log:[],seq:1};
  for(const s of ['P','E']) for(let i=0;i<START_HAND;i++) draw(s);
}
const starOf=(sd,id)=>Math.min(5,Math.max(1,sd.stars[id]||sd.starAll||1));
// 星級加成：每多一星，攻擊 +1、生命 +2
const starAtk=(def,st)=>def.atk>0? def.atk+(st-1) : 0;
const starHp=(def,st)=>def.hp+2*(st-1);
function log(msg,side){S.log.unshift({msg,side:side||''}); if(S.log.length>40) S.log.pop(); ui.log();}
function draw(side){
  const sd=S.sides[side];
  if(sd.hand.length>=HAND_MAX) return false;
  if(!sd.deck.length){ if(!sd.discard.length) return false; sd.deck=shuffle(sd.discard); sd.discard=[]; }
  const id=sd.deck.pop(); sd.hand.push({uid:S.seq++,id,wait:CARDS[id].wait,star:starOf(sd,id)}); return true;
}
function removeFromHand(side,card){const h=S.sides[side].hand; const i=h.indexOf(card); if(i>=0) h.splice(i,1);}

function canTarget(a,t){
  const ad=CARDS[a.id];
  if(ad.ab.fly && !isFly(t)) return false;
  if(!ad.ab.fly && isFly(t) && a.range===1 && !ad.ab.guard) return false;
  return true;
}
function findTarget(u){
  const def=CARDS[u.id]; if(u.range<=0||u.atk<=0) return null;
  const d=dir(u.side); let best=null,bestKey=Infinity;
  for(const t of S.units){
    if(t.side===u.side||!canTarget(u,t)) continue;
    let k=null;
    if(t.lane===u.lane){const s=(t.col-u.col)*d; if(s>=1&&s<=u.range) k=s;}
    if(k===null&&def.ab.guard&&dist(t,u)===1) k=1;
    if(k===null) continue;
    const key=def.ab.snipe? t.hp*100+k : k*100+t.hp;
    if(key<bestKey){bestKey=key;best={unit:t,d:k};}
  }
  if(best) return best;
  const hs=(heroColFor(u.side)-u.col)*d;
  if(hs>=1&&hs<=u.range) return {hero:foeOf(u.side),d:hs};
  return null;
}
function stepTarget(u,mv){
  const d=dir(u.side), fly=isFly(u);
  for(let s=1;s<=mv;s++){
    const c=u.col+d*s; if(c<0||c>=COLS) return 0;
    const o=unitAt(u.lane,c);
    if(!o) return s;
    if(o.side===u.side) continue;          // 友軍可穿越
    if(isFly(o)!==fly) continue;            // 不同高度互不阻擋
    return 0;                               // 被敵人擋住
  }
  return 0;
}
function canSummonAt(side,def,lane,col){
  if(lane<0||lane>=LANES||col<0||col>=COLS||unitAt(lane,col)) return false;
  const reach=def.type==='wall'?5:3;
  const k=side==='P'?col:COLS-1-col;
  return k>=0&&k<reach;
}
function eliteBlocked(side,def){return def.elite && S.units.some(u=>u.side===side&&CARDS[u.id].elite);}
function calcDmg(amt,dtype,t){
  if(amt<=0) return 0;
  if(dtype==='holy') return amt;
  const red=TYPES[dtype]?.phys? t.armor : t.ward;
  return Math.max(1,amt-red);
}
function kill(u){
  S.units=S.units.filter(x=>x!==u);
  S.sides[u.side].discard.push(u.id);
  ui.float(u,'擊破','ko'); log(`${who(u.side)}的${CARDS[u.id].name}被擊破`,foeOf(u.side));
}
function hitUnit(t,amt,dtype){
  const dmg=calcDmg(amt,dtype,t); t.hp-=dmg; ui.float(t,'-'+dmg,'dmg');
  if(t.hp<=0){kill(t); return {killed:true,dmg};}
  if(dtype==='fire') t.st.burn=2;
  else if(dtype==='ice') t.st.slow=1;
  else if(dtype==='thunder'&&Math.random()<0.35){t.st.stun=1; ui.float(t,'暈眩','tag',14);}
  else if(dtype==='dark') t.st.poison=3;
  return {killed:false,dmg};
}
function damageHero(side,amt){
  if(S.phase!=='play') return;
  const sd=S.sides[side]; sd.hp=Math.max(0,sd.hp-amt); ui.heroHit(side,amt);
  if(sd.hp<=0) gameOver(foeOf(side));
}
function healUnit(u,n){const before=u.hp; u.hp=Math.min(u.maxHp,u.hp+n); const g=u.hp-before; if(g>0) ui.float(u,'+'+g,'heal'); return g;}
function gameOver(winner){
  if(S.phase!=='play') return;
  S.phase='over'; S.winner=winner; log(winner==='P'?'你贏了這場對戰':'你的英雄倒下了',winner);
  ui.render(); ui.over();
}
const sleep=ms=>ui.sleep(ms);

async function strike(a,tgt,amt){
  ui.lunge(a,tgt); await sleep(150);
  if(tgt.hero){damageHero(tgt.hero,amt); return {killed:false};}
  return hitUnit(tgt.unit,amt,CARDS[a.id].type);
}
async function attack(a,t,moved){
  const ad=CARDS[a.id];
  if(t.unit){
    const tu=t.unit, td=CARDS[tu.id];
    if(td.ab.first && tu.range>0 && tu.atk>0 && dist(tu,a)<=tu.range && canTarget(tu,a)){
      ui.float(tu,'先制','tag',-14);
      const r=await strike(tu,{unit:a},tu.atk);
      if(r.killed) return {killed:false};
    }
  }
  let amt=a.atk;
  if(ad.ab.charge&&moved>=2){amt+=ad.ab.charge; ui.float(a,'衝鋒','tag',-14);}
  const r=await strike(a,t,amt);
  if(t.unit&&!r.killed&&S.phase==='play'&&a.hp>0){
    const tu=t.unit, td=CARDS[tu.id];
    if(td.ab.counter && dist(tu,a)<=Math.max(1,tu.range) && canTarget(tu,a)){
      await sleep(110); ui.float(tu,'反擊','tag',-14); ui.lunge(tu,{unit:a});
      hitUnit(a,td.ab.counter,'melee');
    }
  }
  return r;
}
async function tick(u){
  if(u.hp<=0||!S.units.includes(u)) return;
  let dmg=0;
  if(u.st.burn>0){u.st.burn--; dmg+=2;}
  if(u.st.poison>0){u.st.poison--; dmg+=1;}
  if(dmg){u.hp-=dmg; ui.float(u,'-'+dmg,'dmg',12); if(u.hp<=0) kill(u); ui.render(); await sleep(120);}
}
async function act(u){
  if(u.hp<=0||!S.units.includes(u)||S.phase!=='play') return;
  const def=CARDS[u.id], d=dir(u.side);
  if(u.st.stun>0){u.st.stun--; ui.float(u,'暈眩中','tag'); await sleep(200); await tick(u); return;}
  if(def.ab.heal){
    let any=0; for(const o of S.units) if(o.side===u.side&&o!==u&&dist(o,u)===1) any+=healUnit(o,def.ab.heal);
    if(any){ui.render(); await sleep(180);}
  }
  if(def.ab.strike){damageHero(foeOf(u.side),def.ab.strike); await sleep(180); if(S.phase!=='play') return;}
  let mv=def.move; if(u.st.slow>0){mv=Math.max(0,mv-1); u.st.slow--;}
  let moved=0, attacked=false;
  while(S.phase==='play'){
    if(!attacked){
      const t=findTarget(u);
      if(t){
        attacked=true;
        const r=await attack(u,t,moved); ui.render(); await sleep(170);
        if(u.hp<=0||S.phase!=='play') return;
        if(r.killed&&u.range===1&&mv>0) continue;
        break;
      }
    }
    if(mv<=0) break;
    const s=stepTarget(u,mv); if(!s) break;
    u.col+=d*s; mv-=s; moved+=s; ui.render(); await sleep(200);
  }
  await tick(u);
}

function summon(side,card,lane,col){
  const def=CARDS[card.id], st=card.star||1;
  const u={uid:S.seq++,id:def.id,side,lane,col,atk:starAtk(def,st),hp:starHp(def,st),maxHp:starHp(def,st),armor:def.armor,ward:def.ward,range:def.range,
    star:st,st:{burn:0,poison:0,slow:0,stun:0}};
  removeFromHand(side,card); S.units.push(u);
  log(`${who(side)}召喚了${def.name}`,side);
  return u;
}
function areaCells(k,lane,col){
  const out=[];
  if(k.area==='sq2'){const l0=Math.min(lane,LANES-2), c0=Math.min(col,COLS-2); for(let l=l0;l<l0+2;l++) for(let c=c0;c<c0+2;c++) out.push([l,c]);}
  else if(k.area==='rank'){for(let l=0;l<LANES;l++) out.push([l,col]);}
  else if(k.area==='sq3'){for(let l=lane-1;l<=lane+1;l++) for(let c=col-1;c<=col+1;c++) if(l>=0&&l<LANES&&c>=0&&c<COLS) out.push([l,c]);}
  return out;
}
function skillTargetOk(side,k,lane,col){
  const u=unitAt(lane,col);
  if(k.target==='enemy') return !!u&&u.side!==side;
  if(k.target==='ally') return !!u&&u.side===side;
  if(k.target==='area') return lane>=0&&lane<LANES&&col>=0&&col<COLS;
  return true;
}
async function castSkill(side,card,lane,col){
  const k=CARDS[card.id], sd=S.sides[side], foe=foeOf(side);
  removeFromHand(side,card);
  const mastered = Math.random()<MASTERY;
  if(mastered){ card.wait=k.wait; sd.hand.push(card); } else sd.discard.push(card.id);
  log(`${who(side)}施放「${k.name}」${mastered?'，觸發專精回到待機區':''}`,side);
  const own=S.units.filter(u=>u.side===side);
  switch(k.id){
    case 'warcry': own.forEach(u=>{if(u.atk>0){u.atk+=2; ui.float(u,'攻擊 +2','buff');}}); break;
    case 'bulwark': {const t=unitAt(lane,col); t.armor+=2; t.maxHp+=6; t.hp+=6; ui.float(t,'護甲 +2','buff'); break;}
    case 'heartshot': damageHero(foe,6); break;
    case 'scout': draw(side); draw(side); break;
    case 'sanctuary': {const h=sd; const g=Math.min(8,h.maxHp-h.hp); h.hp+=g; ui.heroHit(side,-g); own.forEach(u=>healUnit(u,3)); break;}
    case 'mend': for(const [l,c] of areaCells(k,lane,col)){const u=unitAt(l,c); if(u&&u.side===side) healUnit(u,k.heal);} break;
    case 'fireball': case 'nova':
      for(const [l,c] of areaCells(k,lane,col)){const u=unitAt(l,c); if(u&&u.side!==side) hitUnit(u,k.dmg,k.dtype);} break;
    default: {
      const t=unitAt(lane,col);
      if(t){const r=hitUnit(t,k.dmg,k.dtype); if(k.id==='trap'&&!r.killed){t.st.stun=1; ui.float(t,'暈眩','tag',14);}}
    }
  }
  ui.render(); await sleep(320);
}

async function startTurn(side){
  if(S.phase!=='play') return;
  S.active=side; const sd=S.sides[side];
  for(const c of sd.hand) c.wait=Math.max(0,c.wait-1);
  for(const u of S.units){
    const h=CARDS[u.id].ab.haste; if(u.side!==side||!h) continue;
    const c=sd.hand.filter(x=>x.wait>0).sort((a,b)=>b.wait-a.wait)[0];
    if(c){c.wait=Math.max(0,c.wait-h);}
  }
  draw(side);
  if(S.turn>SUDDEN){ const n=S.turn-SUDDEN; log(`延長賽：${who(side)}的英雄受到 ${n} 點消耗傷害`,foeOf(side)); damageHero(side,n); if(S.phase!=='play') return; }
  ui.render();
  if(side==='E'){ await sleep(350); await aiTurn(); if(S.phase==='play') await endTurn('E'); }
  else if(S.auto){ busy=true; ui.render(); await sleep(300); await aiTurn('P'); if(S.phase==='play'&&S.auto!==null) await endTurn('P'); }
  else { busy=false; ui.render(); }
}
async function endTurn(side){
  busy=true; ui.render();
  const d=dir(side);
  const order=S.units.filter(u=>u.side===side).sort((a,b)=>(b.col-a.col)*d||a.lane-b.lane);
  for(const u of order){ if(S.phase!=='play') return; await act(u); }
  if(S.phase!=='play') return;
  if(side==='E') S.turn++;
  await startTurn(foeOf(side));
}

/* ================= 電腦對手 ================= */
function laneThreat(side,lane){
  // 對 side 英雄的威脅：敵方單位越靠近 side 的英雄越危險
  let t=0; for(const u of S.units) if(u.lane===lane&&u.side!==side){
    const closeness = side==='E'? u.col/(COLS-1) : (COLS-1-u.col)/(COLS-1);
    t+=(u.atk+1)*(0.5+closeness);
  }
  return t;
}
function lanePower(side,lane){let p=0; for(const u of S.units) if(u.lane===lane&&u.side===side) p+=u.hp/6+u.atk; return p;}
function planUnit(side,card){
  const def=CARDS[card.id]; if(eliteBlocked(side,def)) return null;
  let best=null;
  for(let l=0;l<LANES;l++){
    const th=laneThreat(side,l), pw=lanePower(side,l);
    let laneScore = def.type==='wall'? th*2 - pw : th*1.4 - pw*0.6;
    if(def.ab.heal) laneScore = pw;
    laneScore += Math.random()*1.5;
    const reach=def.type==='wall'?5:3;
    for(let k=0;k<reach;k++){
      const col= side==='P'? k : COLS-1-k;
      if(!canSummonAt(side,def,l,col)) continue;
      let pos;
      if(def.type==='wall') pos = k>=2? 2 : 0;
      else if(def.range>=2) pos = -k;          // 遠程放後排
      else pos = k;                            // 近戰放前排
      const sc = 10 + def.wait*1.5 + laneScore + pos*0.4;
      if(!best||sc>best.score) best={kind:'unit',card,lane:l,col,score:sc};
    }
  }
  if(best && def.type==='wall' && laneThreat(side,best.lane)<1) best.score=1;
  return best;
}
function dmgValue(side,k,lane,col){
  let v=0;
  const cells = k.target==='area'? areaCells(k,lane,col) : [[lane,col]];
  for(const [l,c] of cells){
    const u=unitAt(l,c); if(!u) continue;
    if(k.heal){ if(u.side===side) v+=Math.min(k.heal,u.maxHp-u.hp); continue; }
    if(u.side===side) continue;
    const dmg=calcDmg(k.dmg,k.dtype,u);
    v += dmg>=u.hp ? 8+u.atk*1.5+CARDS[u.id].wait : dmg+u.atk*0.5;
    if(k.id==='trap') v+=3;
  }
  return v;
}
function planSkill(side,card){
  const k=CARDS[card.id], sd=S.sides[side], own=S.units.filter(u=>u.side===side);
  if(k.target==='none'){
    let v=0;
    if(k.id==='warcry') v = own.filter(u=>u.atk>0).length>=2 ? own.length*3 : 0;
    if(k.id==='heartshot') v = 9;
    if(k.id==='scout') v = sd.hand.length<=3 ? 7 : (sd.hand.length<=HAND_MAX-2 ? 3 : 0);
    if(k.id==='sanctuary'){ v = Math.min(8,sd.maxHp-sd.hp) + own.reduce((s,u)=>s+Math.min(3,u.maxHp-u.hp),0); if(v<7) v=0; }
    return v>0? {kind:'skill',card,lane:0,col:0,score:v} : null;
  }
  if(k.target==='ally'){
    const t=own.filter(u=>u.atk>0).sort((a,b)=>(b.col-a.col)*dir(side)||b.atk-a.atk)[0];
    return t? {kind:'skill',card,lane:t.lane,col:t.col,score:5} : null;
  }
  let best=null;
  for(let l=0;l<LANES;l++) for(let c=0;c<COLS;c++){
    if(!skillTargetOk(side,k,l,c)) continue;
    const v=dmgValue(side,k,l,c);
    if(!best||v>best.score) best={kind:'skill',card,lane:l,col:c,score:v};
  }
  const min = k.heal? 7 : 4;
  return best&&best.score>=min? best : null;
}
async function aiTurn(side='E'){
  const sd=S.sides[side];
  for(let guard=0; guard<12 && S.phase==='play'; guard++){
    let best=null;
    for(const c of sd.hand.filter(c=>c.wait===0)){
      const plan = CARDS[c.id].kind==='unit'? planUnit(side,c) : planSkill(side,c);
      if(plan&&(!best||plan.score>best.score)) best=plan;
    }
    if(!best) break;
    await sleep(380);
    if(best.kind==='unit') summon(side,best.card,best.lane,best.col);
    else await castSkill(side,best.card,best.lane,best.col);
    ui.render();
  }
}

const SAVE_KEY='lanecards-save-v1';

  {name:'熔岩渡口',icon:'🌋',tone:'#8a4a2c',stages:['焦土堤','熔岩浮橋','火山渡口']},
  {name:'黑曜要塞',icon:'🏰',tone:'#4a3d5c',stages:['外牆','迴廊','王座廳']},
];
const CLS_KEYS=Object.keys(CLASSES);
const STAGES=[]; CHAPTERS.forEach((ch,ci)=>ch.stages.forEach((nm,si)=>{
  const i=STAGES.length, boss=si===2;
  STAGES.push({i,ci,si,name:nm,boss,ecls:CLS_KEYS[(i*3+ci)%4],hp:28+i*3+(boss?8:0),star:Math.min(5,1+Math.floor(i/3)),
    gold:40+i*15,exp:30+i*12});
}));
const UNIT_IDS=Object.values(CARDS).filter(c=>c.kind==='unit').map(c=>c.id);
const DROP_W=[0,50,30,14,6];

let SV=null;
function freshSave(cls){
  const coll={};
  const add=(id,n)=>{coll[id]=coll[id]||{n:0,star:1}; coll[id].n+=n;};
  for(const [id,n] of Object.entries(CLASSES[cls].deck)) add(id,n);
  for(const k of CLS_KEYS) if(k!==cls) for(const c of Object.values(CARDS)) if(c.kind==='skill'&&c.cls===k) add(c.id,2);
  return {v:1,cls,level:1,exp:0,gold:100,gems:0,coll,deck:starterDeck(cls),cleared:{},wins:0,losses:0,created:Date.now()};
}
function loadSave(){ try{ const t=localStorage.getItem(SAVE_KEY); if(t){ const d=JSON.parse(t); if(d&&d.v===1) return d; } }catch(e){} return null; }
function persist(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(SV)); }catch(e){} }
const expNeed=lv=>80+lv*40;
const heroHpFor=lv=>Math.min(60,HERO_HP+2*(lv-1));
const ownedN=id=>SV.coll[id]?.n||0;
const starOfOwned=id=>SV.coll[id]?.star||1;
function deckCounts(deck){const m={}; for(const id of deck) m[id]=(m[id]||0)+1; return m;}
function deckLegalFor(cls,deck){ return deck.filter(id=>{const c=CARDS[id]; return c&&(c.kind==='unit'||c.cls===cls);}); }
function deckPower(deck){
  let p=0; for(const id of deck){ const c=CARDS[id], st=starOfOwned(id);
    p+= c.kind==='unit'? (starAtk(c,st)*12+starHp(c,st)*5+(c.elite?40:0)) : 45; }
  return Math.round(p);
}
function stageOpen(i){ return i===0 || !!SV.cleared[i-1]; }
function rollDrop(){
  const pool=[...UNIT_IDS, ...Object.values(CARDS).filter(c=>c.kind==='skill'&&c.cls===SV.cls).map(c=>c.id)];
  const w=pool.map(id=>CARDS[id].kind==='unit'? DROP_W[quality(CARDS[id])] : 18);
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){ r-=w[i]; if(r<=0) return pool[i]; }
  return pool[0];
}
function gainCard(id){ SV.coll[id]=SV.coll[id]||{n:0,star:1}; SV.coll[id].n++; }
function gainExp(n){
  SV.exp+=n; const ups=[];
  while(SV.exp>=expNeed(SV.level)){ SV.exp-=expNeed(SV.level); SV.level++; ups.push(SV.level); }
  return ups;
}
function settle(win,ctx){
  const out={gold:0,exp:0,cards:[],gems:0,levels:[],first:false};
  if(ctx.kind==='stage'){
    const st=STAGES[ctx.i];
    if(win){
      out.first=!SV.cleared[ctx.i]; SV.cleared[ctx.i]=true;
      out.gold=st.gold*(out.first?2:1); out.exp=st.exp;
      if(out.first){ out.cards.push(rollDrop()); out.gems=st.boss?3:1; if(st.boss) out.cards.push(rollDrop()); }
      else if(Math.random()<0.4) out.cards.push(rollDrop());
    } else out.exp=10;
  } else {
    if(win){ out.gold=25+SV.level*3; out.exp=18; if(Math.random()<0.25) out.cards.push(rollDrop()); }
    else out.exp=6;
  }
  SV.gold+=out.gold; SV.gems+=out.gems; out.cards.forEach(gainCard);
  out.levels=gainExp(out.exp);
  if(win) SV.wins++; else SV.losses++;
  persist();
  return out;
}

  return panel('牌組營帳',`
    <div class="deckwrap">
      <aside class="decklist">
        <div class="dhead"><b>目前牌組</b><span class="${ok?'':'bad'}">${n} 張（${DECK_MIN}～${DECK_MAX}）</span></div>
        <div class="dpow">牌組戰鬥力 <b>${deckPower(SV.deck)}</b></div>
        <div class="drows">${list||'<p class="muted">牌組是空的，點右邊的卡加入。</p>'}</div>
        <div class="row"><button type="button" class="btn" id="dReset">恢復預設牌組</button></div>
        <p class="muted">點左邊的列移除一張。同名卡最多 ${COPY_MAX} 張，且不能超過持有數量；技能牌只能放目前職業的。</p>
      </aside>
      <div class="pool">
        <div class="row tabs">${[['all','全部'],['unit','士兵'],['skill','技能']].map(([k,t])=>`<button type="button" class="btn ${deckFilter===k?'on':''}" data-df="${k}">${t}</button>`).join('')}</div>
        <div class="cgrid">${grid}</div>
      </div>
    </div>`);
}

/* ---- 圖鑑書庫 ---- */
const RACES=['人類','精靈','獸人','亡靈','地精','巨魔','野獸'];
function codexView(){
  const tabs=[...RACES,...CLS_KEYS.map(k=>CLASSES[k].name+'技能')];
  const idsFor=t=> RACES.includes(t)? UNIT_IDS.filter(id=>RACE[id]===t)
    : Object.values(CARDS).filter(c=>c.kind==='skill'&&CLASSES[c.cls].name+'技能'===t).map(c=>c.id);
  const all=Object.keys(CARDS), have=all.filter(id=>ownedN(id)>0).length;
  const pct=t=>{const ids=idsFor(t); return ids.length? Math.round(ids.filter(id=>ownedN(id)>0).length/ids.length*100):0;};
  const ids=idsFor(codexTab);
  return panel('圖鑑書庫',`
    <div class="codex">
      <aside class="ctabs">${tabs.map(t=>`<button type="button" class="ctab ${t===codexTab?'on':''}" data-ct="${t}"><span>${t}</span><em>${pct(t)}%</em></button>`).join('')}</aside>
      <div class="pool"><div class="cgrid">${ids.map(id=>{const o=ownedN(id); return miniCard(id,{star:starOfOwned(id),locked:!o,tag:o?`持有 ${o}`:''});}).join('')}</div></div>
    </div>`, `<span class="rate">總收集率 <b>${Math.round(have/all.length*100)}%</b>（${have}/${all.length}）</span>`);
}

/* ---- 鍊成工坊 ---- */
const upCost=st=>({copies:st, gold:60*st});
function alchemyView(){
  const ids=Object.keys(SV.coll).filter(id=>CARDS[id]&&CARDS[id].kind==='unit').sort((a,b)=>ownedN(b)-ownedN(a));
  const sel=alchemySel&&SV.coll[alchemySel]? alchemySel : null;
  let detail='<p class="muted">選一張士兵卡，查看升星需求。</p>';
  if(sel){
    const def=CARDS[sel], st=starOfOwned(sel), cost=upCost(st), n=ownedN(sel);
    const can= st<5 && n-1>=cost.copies && SV.gold>=cost.gold;
    detail= st>=5? `<h3>${def.icon} ${def.name}</h3><p>已經是最高的五星。</p>` :
      `<h3>${def.icon} ${def.name} ${starsHTML(st)} → ${starsHTML(st+1)}</h3>
       <div class="stats"><span>攻 <b>${starAtk(def,st)}</b> → <b class="up">${starAtk(def,st+1)}</b></span><span>血 <b>${starHp(def,st)}</b> → <b class="up">${starHp(def,st+1)}</b></span></div>
       <ul><li>消耗重複卡 ${cost.copies} 張（持有 ${n} 張，至少保留 1 張）</li><li>消耗金幣 ${cost.gold}（持有 ${SV.gold}）</li></ul>
       <button type="button" class="end" id="doUp" ${can?'':'disabled'}>${can?'鍊成升星':'材料不足'}</button>`;
  }
  const grid=ids.map(id=>miniCard(id,{star:starOfOwned(id),tag:`×${ownedN(id)}`,cls:id===sel?'picked':''})).join('');
  return panel('鍊成工坊',`<div class="deckwrap"><aside class="decklist alc">${detail}<p class="muted">星級提升後，所有牌組裡的同名卡都會變強：每星攻擊 +1、生命 +2。重複的卡可以從關卡掉落取得。</p></aside><div class="pool"><div class="cgrid">${grid}</div></div></div>`);
}

/* ---- 英雄大廳 ---- */
function heroView(){
  return panel('英雄大廳',`
    <div class="herohall">
      <div class="hstat"><div class="face">${CLASSES[SV.cls].icon}</div>
        <ul><li>等級 <b>Lv.${SV.level}</b>（經驗 ${SV.exp} / ${expNeed(SV.level)}）</li><li>英雄生命 <b>${heroHpFor(SV.level)}</b>（每升一級 +2，上限 60）</li>
        <li>戰績 <b>${SV.wins}</b> 勝 <b>${SV.losses}</b> 敗</li><li>已通關 <b>${Object.keys(SV.cleared).length}</b> / ${STAGES.length} 關</li></ul></div>
      <h3>職業</h3><p class="muted">切換職業不用花費。牌組裡其他職業的技能牌會自動移除，記得到牌組營帳補上新職業的技能。</p>
      <div class="classes">${CLS_KEYS.map(k=>{const c=CLASSES[k]; return `<button type="button" class="cls ${k===SV.cls?'on':''}" data-cls="${k}"><span class="ic">${c.icon}</span><b>${c.name}</b><span>${c.desc}</span><span class="sig">技能：${c.sig}</span>${k===SV.cls?'<em>目前職業</em>':''}</button>`;}).join('')}</div>
      <div class="row" style="margin-top:16px"><button type="button" class="btn" id="wipe">清除存檔重新開始</button></div>
    </div>`);
}

function renderTown(){
  townEl.innerHTML = view==='map'? mapView() : view==='deck'? deckView() : view==='codex'? codexView() : view==='alchemy'? alchemyView() : view==='hero'? heroView() : homeView();
}
function go(v){ if(v==='spar'){ startSpar(); return; } view=v; renderTown(); window.scrollTo(0,0); }
function showTown(v){ battleEl.hidden=true; townEl.hidden=false; ov.hidden=true; if(v) view=v; renderTown(); }

townEl.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.go!==undefined && t.dataset.go!==''){ go(t.dataset.go); return; }
  if(t.id==='tRules'){ showRules(); return; }
  if(t.dataset.ch!==undefined){ mapCh=+t.dataset.ch; renderTown(); return; }
  if(t.dataset.fight!==undefined){ startStage(+t.dataset.fight); return; }
  if(t.dataset.df){ deckFilter=t.dataset.df; renderTown(); return; }
  if(t.dataset.rm){ const i=SV.deck.lastIndexOf(t.dataset.rm); if(i>=0) SV.deck.splice(i,1); persist(); renderTown(); return; }
  if(t.id==='dReset'){ SV.deck=starterDeck(SV.cls).filter(id=>ownedN(id)>0); persist(); renderTown(); return; }
  if(t.dataset.ct){ codexTab=t.dataset.ct; renderTown(); return; }
  if(t.id==='doUp'){ const id=alchemySel, st=starOfOwned(id), c=upCost(st);
    if(st<5&&ownedN(id)-1>=c.copies&&SV.gold>=c.gold){ SV.coll[id].n-=c.copies; SV.coll[id].star=st+1; SV.gold-=c.gold;
      const cnt=deckCounts(SV.deck); while((cnt[id]||0)>Math.min(COPY_MAX,SV.coll[id].n)){ SV.deck.splice(SV.deck.lastIndexOf(id),1); cnt[id]--; }
      persist(); } renderTown(); return; }
  if(t.dataset.cls&&view==='hero'){ SV.cls=t.dataset.cls; SV.deck=deckLegalFor(SV.cls,SV.deck); persist(); renderTown(); return; }
  if(t.id==='wipe'){ ov.hidden=false; ov.innerHTML=`<div class="panel frame"><h2 style="font-size:28px">清除存檔？</h2><p class="lead">等級、卡牌、金幣與通關紀錄都會刪除，無法復原。</p>
      <div class="row"><button type="button" class="end" id="wipeYes">確定清除</button><button type="button" class="btn" id="wipeNo">取消</button></div></div>`;
    $('#wipeYes').onclick=()=>{ try{localStorage.removeItem(SAVE_KEY);}catch(e){} SV=null; showCreate(); };
    $('#wipeNo').onclick=()=>{ ov.hidden=true; }; return; }
  if(t.classList.contains('mini')){
    const id=t.dataset.id;
    if(view==='deck'){ const cnt=deckCounts(SV.deck); if((cnt[id]||0)<Math.min(COPY_MAX,ownedN(id)) && SV.deck.length<DECK_MAX){ SV.deck.push(id); persist(); renderTown(); } return; }
    if(view==='alchemy'){ alchemySel=id; renderTown(); return; }
  }
});

/* ---- 開戰與結算 ---- */
function deckReady(){ const n=SV.deck.length; return n>=DECK_MIN&&n<=DECK_MAX; }
function needDeck(){ ov.hidden=false; ov.innerHTML=`<div class="panel frame"><h2 style="font-size:28px">牌組張數不符</h2><p class="lead">牌組需要 ${DECK_MIN}～${DECK_MAX} 張，目前 ${SV.deck.length} 張。</p><div class="row"><button type="button" class="end" id="toDeck">前往牌組營帳</button></div></div>`; $('#toDeck').onclick=()=>showTown('deck'); }
function myStars(){ const m={}; for(const id of Object.keys(SV.coll)) m[id]=SV.coll[id].star||1; return m; }
function launch(ecls,eopts,ctx,label){
  newGame(SV.cls,ecls,{ctx,P:{deck:SV.deck.slice(),stars:myStars(),hp:heroHpFor(SV.level)},E:eopts});
  S.auto=autoPref;
  for(const el of els.values()) el.remove(); els.clear(); fxEl.innerHTML='';
  sel=null; areaPick=null; inspect=null; busy=false;
  townEl.hidden=true; battleEl.hidden=false; ov.hidden=true; ov.innerHTML='';
  layout(); syncAuto();
  log(`${label}：你是${CLASSES[SV.cls].name}，對手是${CLASSES[ecls].name}`);
  startTurn('P');
}
function startStage(i){
  if(!deckReady()) return needDeck();
  const st=STAGES[i];
  launch(st.ecls,{starAll:st.star,hp:st.hp},{kind:'stage',i},`${CHAPTERS[st.ci].name}・${st.name}`);
}
function startSpar(){
  if(!deckReady()) return needDeck();
  const ecls=CLS_KEYS[Math.floor(Math.random()*4)];
  launch(ecls,{starAll:Math.min(5,1+Math.floor(SV.level/4)),hp:heroHpFor(SV.level)},{kind:'spar'},'練兵場');
}
ui.over=()=>{
  const win=S.winner==='P', ctx=S.ctx||{kind:'spar'};
  const r=settle(win,ctx);
  const st=ctx.kind==='stage'?STAGES[ctx.i]:null, nextOpen=st&&STAGES[st.i+1]&&stageOpen(st.i+1);
  const cards=r.cards.length? `<div class="loot">${r.cards.map(id=>miniCard(id,{star:starOfOwned(id),tag:'新獲得'})).join('')}</div>`:'';
  ov.hidden=false;
  ov.innerHTML=`<div class="panel frame"><h2>${win?'勝利':'敗北'}</h2>
    <p class="result">${win?`第 ${S.turn} 回合擊倒對手英雄。`:`撐到第 ${S.turn} 回合，你的英雄倒下了。`}${r.first?'首次通關！':''}</p>
    <div class="rewards"><span>🪙 +${r.gold}</span><span>經驗 +${r.exp}</span>${r.gems?`<span>💎 +${r.gems}</span>`:''}${r.levels.length?`<span class="up">升到 Lv.${r.levels[r.levels.length-1]}！英雄生命 ${heroHpFor(SV.level)}</span>`:''}</div>
    ${cards}
    <div class="row">${win&&nextOpen?`<button type="button" class="end" id="nextBtn">下一關</button>`:''}
      <button type="button" class="${win&&nextOpen?'btn':'end'}" id="againBtn">再戰一次</button>
      <button type="button" class="btn" id="homeBtn">回主城</button><button type="button" class="btn" id="viewBtn">看戰場</button></div></div>`;
  if($('#nextBtn')) $('#nextBtn').onclick=()=>startStage(st.i+1);
  $('#againBtn').onclick=()=>ctx.kind==='stage'?startStage(ctx.i):startSpar();
  $('#homeBtn').onclick=()=>showTown(ctx.kind==='stage'?'map':'home');
  $('#viewBtn').onclick=()=>{ov.hidden=true;};
};
function showRules(){
  ov.hidden=false;
  ov.innerHTML=`<div class="panel frame"><h2 style="font-size:30px">規則</h2>${RULES}<div class="row" style="margin-top:14px"><button type="button" class="end" id="closeBtn">關閉</button></div></div>`;
  $('#closeBtn').onclick=()=>{ if(S&&S.phase==='over'&&!battleEl.hidden) ui.over(); else ov.hidden=true; };
}
$('#rulesBtn').addEventListener('click',showRules);
$('#newBtn').addEventListener('click',()=>{
  if(!S||S.phase!=='play'){ showTown(); return; }
  ov.hidden=false; ov.innerHTML=`<div class="panel frame"><h2 style="font-size:28px">撤退回城？</h2><p class="lead">這場會算作敗北，只拿到少量經驗。</p>
    <div class="row"><button type="button" class="end" id="rtYes">撤退</button><button type="button" class="btn" id="rtNo">繼續戰鬥</button></div></div>`;
  $('#rtYes').onclick=()=>{ const ctx=S.ctx||{kind:'spar'}; S.phase='over'; S.winner='E'; S.auto=null; settle(false,ctx); showTown(ctx.kind==='stage'?'map':'home'); };
  $('#rtNo').onclick=()=>{ ov.hidden=true; };
});

/* ---- 自動戰鬥 ---- */
let autoPref=false;
try{ autoPref=localStorage.getItem('lc-auto')==='1'; }catch(e){}
function syncAuto(){ const b=$('#autoBtn'); b.textContent=`自動：${S&&S.auto?'開':'關'}`; b.setAttribute('aria-pressed',S&&S.auto?'true':'false'); b.classList.toggle('on',!!(S&&S.auto)); }
$('#autoBtn').addEventListener('click',()=>{
  if(!S||S.phase!=='play') return;
  S.auto=!S.auto; autoPref=S.auto; try{localStorage.setItem('lc-auto',S.auto?'1':'0');}catch(e){}
  syncAuto();
  if(S.auto&&!busy&&S.active==='P'){ sel=null; areaPick=null; inspect=null; busy=true; render();
    (async()=>{ await aiTurn('P'); if(S.phase==='play'&&S.auto) await endTurn('P'); else { busy=false; render(); } })(); }
});

/* ---- 建立角色 ---- */
function showCreate(){
  battleEl.hidden=true; townEl.hidden=true; ov.hidden=false;
  ov.innerHTML=`<div class="panel frame"><h2>三路卡陣</h2>
    <p class="lead">三條石道、十格戰線。排好待機區、算準出牌時機，讓自動前進的部隊替你衝破敵陣。先選一個職業，之後可以在英雄大廳切換。</p>
    <div class="classes">${CLS_KEYS.map(k=>{const c=CLASSES[k]; return `<button type="button" class="cls" data-cls="${k}"><span class="ic">${c.icon}</span><b>${c.name}</b><span>${c.desc}</span><span class="sig">技能：${c.sig}</span></button>`;}).join('')}</div>
    <details style="margin-top:14px"><summary>怎麼玩</summary>${RULES}</details></div>`;
  ov.querySelectorAll('.cls').forEach(b=>b.onclick=()=>{ SV=freshSave(b.dataset.cls); persist(); showTown('home'); });
}

window.addEventListener('resize',()=>{clearTimeout(window.__rz); window.__rz=setTimeout(()=>{ if(S&&!battleEl.hidden) layout(); },120);});
window.claude?.hot?.snapshot?.(()=>({view}));
function boot(data){
  newGame('warrior','mage'); layout();
  SV=loadSave();
  if(!SV) showCreate(); else showTown((data&&data.view)||'home');
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
}
}

</script>

</body>
</html>
